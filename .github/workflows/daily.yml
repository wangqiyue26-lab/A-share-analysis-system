name: Daily cloud health

on:
  schedule:
    # China Standard Time has no DST: 09:17 UTC = 17:17 Asia/Shanghai.
    - cron: "17 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Runtime health
        run: ashare-system health --output reports/health/latest.json
      - name: Recent A-share data smoke
        run: ashare-system smoke-data --symbol 000001 --cache-dir data/cache
      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: phase1-health-${{ github.run_id }}
          path: reports/health/latest.json
          retention-days: 14
