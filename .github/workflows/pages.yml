name: Deploy A-share dashboard

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  schedule:
    # 17:37 China Standard Time on weekdays.
    - cron: "37 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore market history cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: pages-ashare-hfq-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pages-ashare-hfq-${{ runner.os }}-
            ashare-hfq-${{ runner.os }}-
      - name: Install
        run: python -m pip install -e .
      - name: Run full-market daily selection
        run: >-
          ashare-system daily-select
          --prefilter 60
          --top 20
          --workers 4
          --cache-root data/cache
          --output-dir reports/output/pages-latest
      - name: Build static dashboard
        run: >-
          ashare-system build-site
          --selection-dir reports/output/pages-latest
          --output-dir site
          --mode-label "全市场云端筛选"
      - name: Verify production page
        run: |
          test -s site/index.html
          test -f site/.nojekyll
          grep -q "全市场覆盖" site/index.html
          grep -q "不构成个股推荐" site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
