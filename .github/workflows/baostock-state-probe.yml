name: BaoStock historical state probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/ashare_system/baostock_state_probe.py"
      - "tests/test_baostock_state_probe.py"
      - "pyproject.toml"
      - ".github/workflows/baostock-state-probe.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: baostock-state-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Download latest validated lifecycle artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list             --workflow historical-pit-reconstruction.yml             --branch main             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful lifecycle inventory run found."
            exit 1
          fi
          mkdir -p reports/baostock-state-probe/lifecycle-source
          gh run download "$run_id"             --pattern 'historical-pit-lifecycle-*'             --dir reports/baostock-state-probe/lifecycle-source
          lifecycle_file=$(find reports/baostock-state-probe/lifecycle-source             -name lifecycle.csv -print -quit)
          summary_file=$(find reports/baostock-state-probe/lifecycle-source             -name summary.json -print -quit)
          test -n "$lifecycle_file"
          test -n "$summary_file"
          cp "$lifecycle_file" reports/baostock-state-probe/lifecycle.csv
          cp "$summary_file" reports/baostock-state-probe/lifecycle_summary.json
          printf '{"source_run_id":"%s"}
' "$run_id"             > reports/baostock-state-probe/lifecycle_source.json

      - name: Run BaoStock current/delisted state probe
        run: >-
          python -m ashare_system.baostock_state_probe
          --lifecycle-file reports/baostock-state-probe/lifecycle.csv
          --output-dir reports/baostock-state-probe/result
          --period-start 2023-01-03
          --period-end 2026-11-03
          --per-cohort 12

      - name: Show probe decision
        run: cat reports/baostock-state-probe/result/summary.json

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: baostock-state-probe-${{ github.run_id }}
          path: reports/baostock-state-probe/
          retention-days: 90
