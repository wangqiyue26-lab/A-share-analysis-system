name: BaoStock historical state probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/ashare_system/baostock_state_probe.py"
      - "tests/test_baostock_state_probe.py"
      - "pyproject.toml"
      - ".github/workflows/baostock-state-probe.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: baostock-state-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Download fixed validated lifecycle artifact
        uses: actions/download-artifact@v4
        with:
          pattern: historical-pit-lifecycle-*
          path: reports/baostock-state-probe/lifecycle-source
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 41625117222

      - name: Verify lifecycle source
        run: |
          test -f reports/baostock-state-probe/lifecycle-source/lifecycle.csv
          test -f reports/baostock-state-probe/lifecycle-source/summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports/baostock-state-probe/lifecycle-source")
          payload = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert payload["status"] == "inventory_complete", payload
          assert payload["period_start"] == "2023-01-03", payload
          assert payload["period_end"] == "2026-11-03", payload
          assert payload["listing_date_coverage"] == 1.0, payload
          assert payload["delist_date_coverage_for_delisted"] == 1.0, payload
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Run BaoStock current/delisted state probe
        run: >-
          python -m ashare_system.baostock_state_probe
          --lifecycle-file reports/baostock-state-probe/lifecycle-source/lifecycle.csv
          --output-dir reports/baostock-state-probe/result
          --period-start 2023-01-03
          --period-end 2026-11-03
          --per-cohort 12

      - name: Show probe decision
        run: cat reports/baostock-state-probe/result/summary.json

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: baostock-state-probe-${{ github.run_id }}
          path: reports/baostock-state-probe/
          retention-days: 90
