name: Phase 3 backtest smoke

on:
  push:
    branches:
      - "phase/3-backtest-rules"
    paths:
      - "src/ashare_system/backtest/**"
      - ".github/workflows/backtest-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-daily-bar-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run real A-share backtest smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from ashare_system.backtest import BacktestEngine
          from ashare_system.data.akshare_provider import AkshareEastmoneyProvider
          from ashare_system.data.akshare_sina_provider import AkshareSinaProvider
          from ashare_system.data.router import DataRouter

          router = DataRouter([AkshareEastmoneyProvider(), AkshareSinaProvider()])
          bars = router.get_daily_bars("000001", "20240102", "20240329", "")
          dates = bars["trade_date"].sort_values().reset_index(drop=True)
          assert len(dates) > 20

          signals = pd.DataFrame(
              [
                  {
                      "trade_date": dates.iloc[2],
                      "symbol": "000001",
                      "target_weight": 0.50,
                      "board": "主板",
                      "is_st": False,
                  },
                  {
                      "trade_date": dates.iloc[-5],
                      "symbol": "000001",
                      "target_weight": 0.0,
                      "board": "主板",
                      "is_st": False,
                  },
              ]
          )
          result = BacktestEngine(initial_cash=100_000.0).run({"000001": bars}, signals)
          assert len(result.trades) >= 2
          assert result.trades.iloc[0]["trade_date"] > result.trades.iloc[0]["signal_date"]

          output = Path("reports/output/backtest-smoke")
          output.mkdir(parents=True, exist_ok=True)
          result.equity_curve.to_csv(output / "equity.csv", index=False)
          result.trades.to_csv(output / "trades.csv", index=False)
          (output / "metrics.json").write_text(
              json.dumps(result.metrics, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({"provider": router.last_provider_name, **result.metrics}, indent=2))
          PY
      - name: Upload backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-backtest-${{ github.run_id }}
          path: reports/output/backtest-smoke/
          retention-days: 14
