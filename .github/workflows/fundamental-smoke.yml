name: Phase 2 fundamental smoke

on:
  push:
    branches: [main, "phase/2b-integrated"]
    paths:
      - "src/ashare_system/data/financials.py"
      - "src/ashare_system/data/point_in_time.py"
      - "src/ashare_system/cli.py"
      - ".github/workflows/fundamental-smoke.yml"
  pull_request:
    paths:
      - "src/ashare_system/data/financials.py"
      - "src/ashare_system/data/point_in_time.py"
      - "src/ashare_system/cli.py"
      - ".github/workflows/fundamental-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-financial-statement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Fetch disclosure-timestamped financial facts
        run: >-
          ashare-system smoke-fundamentals
          --symbol 000001
          --statement 利润表
          --output reports/output/fundamental-smoke/000001-profit.parquet
      - name: Verify PIT fields
        run: |
          python - <<'PY'
          import pandas as pd

          frame = pd.read_parquet(
              "reports/output/fundamental-smoke/000001-profit.parquet"
          )
          assert len(frame) > 0
          assert frame["period_end"].notna().all()
          assert frame["available_at"].notna().all()
          assert (frame["available_at"] >= frame["period_end"]).all()
          print(
              frame[["period_end", "available_at", "metric", "value"]]
              .tail(8)
              .to_string(index=False)
          )
          PY
      - name: Upload financial snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase2-fundamentals-${{ github.run_id }}
          path: reports/output/fundamental-smoke/
          retention-days: 14
