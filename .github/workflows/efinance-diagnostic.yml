name: Phase 4B efinance batch diagnostic

on:
  push:
    branches:
      - "phase/4b-daily-production"
    paths:
      - ".github/workflows/efinance-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and efinance
        run: python -m pip install -e . efinance
      - name: Fetch dynamic candidates with efinance in one batch
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import efinance as ef

          from ashare_system.data.security_master import AkshareSecurityMasterProvider
          from ashare_system.data.spot import AkshareEastmoneySpotProvider, select_liquid_candidates

          tz = ZoneInfo("Asia/Shanghai")
          today = datetime.now(tz).date()
          master = AkshareSecurityMasterProvider().get_current(require_complete=True)
          try:
              spot = AkshareEastmoneySpotProvider().get_current()
          except Exception:
              spot = None
          candidates = select_liquid_candidates(
              master,
              spot,
              as_of=str(today),
              limit=10,
              min_amount=50_000_000,
              min_listing_days=120,
          )
          symbols = [str(code).zfill(6) for code in candidates["symbol"].tolist()]
          result = ef.stock.get_quote_history(
              symbols,
              beg=(today - timedelta(days=420)).strftime("%Y%m%d"),
              end=today.strftime("%Y%m%d"),
              fqt=1,
              suppress_error=True,
          )
          if not isinstance(result, dict):
              raise TypeError(f"expected dict for batch history, got {type(result)!r}")
          rows = {str(symbol).zfill(6): int(len(frame)) for symbol, frame in result.items()}
          nonempty = {symbol: count for symbol, count in rows.items() if count > 80}
          print(json.dumps({"symbols": symbols, "rows": rows, "usable": len(nonempty)}, ensure_ascii=False, indent=2))
          assert len(nonempty) >= 8, f"only {len(nonempty)} / {len(symbols)} histories were usable"
          first = next(frame for frame in result.values() if len(frame) > 80)
          print(first.tail(3).to_string(index=False))
          PY
