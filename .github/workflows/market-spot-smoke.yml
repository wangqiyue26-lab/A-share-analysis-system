name: Phase 4B full-market spot smoke

on:
  push:
    branches:
      - "phase/4b-market-universe"
    paths:
      - "src/ashare_system/data/spot.py"
      - "tests/test_spot_provider.py"
      - ".github/workflows/market-spot-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-full-market-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Fetch and prefilter full A-share snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from ashare_system.data.spot import AkshareSpotProvider, prefilter_spot_snapshot

          snapshot = AkshareSpotProvider().get_snapshot()
          candidates = prefilter_spot_snapshot(
              snapshot,
              top_n=100,
              min_amount=50_000_000.0,
              min_price=1.0,
              exclude_st=True,
          )
          assert len(snapshot) > 4_000
          assert len(candidates) == 100
          assert candidates["amount"].is_monotonic_decreasing

          output = Path("reports/output/market-spot-smoke")
          output.mkdir(parents=True, exist_ok=True)
          snapshot.to_parquet(output / "snapshot.parquet", index=False)
          candidates.to_csv(output / "candidates.csv", index=False)
          summary = {
              "provider": snapshot.attrs.get("provider"),
              "snapshot_rows": len(snapshot),
              "candidate_rows": len(candidates),
              "observed_at": snapshot["observed_at"].max().isoformat(),
              "top_amount": float(candidates.iloc[0]["amount"]),
              "lowest_candidate_amount": float(candidates.iloc[-1]["amount"]),
          }
          (output / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Upload market snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-market-spot-${{ github.run_id }}
          path: reports/output/market-spot-smoke/
          retention-days: 7
