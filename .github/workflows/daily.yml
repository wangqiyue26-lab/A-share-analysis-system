name: Daily A-share production

on:
  push:
    branches:
      - main
      - "phase/4b-daily-production"
    paths:
      - "src/ashare_system/production.py"
      - "src/ashare_system/data/spot.py"
      - "src/ashare_system/data/cache.py"
      - "src/ashare_system/factors/**"
      - "src/ashare_system/reporting.py"
      - "src/ashare_system/site.py"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/daily.yml"
  schedule:
    # 17:23 China Standard Time on weekdays. Holiday runs safely reuse the latest market date.
    - cron: "23 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ashare-production-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ashare-production-${{ runner.os }}-
      - name: Install
        run: python -m pip install -e .
      - name: Run daily production research
        run: >-
          ashare-daily
          --candidate-limit 30
          --top 10
          --history-days 420
          --workers 4
          --output-root reports/production
          --site-dir site
          --cache-root data/cache
      - name: Verify production outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("reports/production/manifest.json").read_text(encoding="utf-8"))
          assert manifest["selected_count"] > 0
          assert manifest["history_success_count"] >= manifest["selected_count"]
          assert Path("reports/production/selection/selected.csv").exists()
          assert Path("site/index.html").exists()
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ github.run_id }}
          path: reports/production/
          retention-days: 14
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
