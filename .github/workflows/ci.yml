name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: CLI health
        run: ashare-system health

  public-data-smoke:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Multi-endpoint A-share network smoke test
        timeout-minutes: 5
        run: ashare-system smoke-data --symbol 000001 --start 20240102 --end 20240110 --adjust ""
      - name: Independent all-market live spot health check
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python - <<'PY'
          import json

          from ashare_system.data.spot import AkshareEastmoneySpotProvider, AkshareSinaSpotProvider

          providers = (AkshareSinaSpotProvider(), AkshareEastmoneySpotProvider())
          errors = []
          for provider in providers:
              try:
                  frame = provider.get_current()
                  positive_amount = int(frame["amount"].gt(0).sum())
                  if len(frame) < 3000 or positive_amount < 2500:
                      raise RuntimeError(
                          f"insufficient live rows={len(frame)}, positive_amount_rows={positive_amount}"
                      )
                  print(json.dumps({
                      "provider": provider.name,
                      "rows": len(frame),
                      "positive_amount_rows": positive_amount,
                      "status": "healthy",
                  }, ensure_ascii=False, indent=2))
                  break
              except Exception as exc:
                  errors.append(f"{provider.name}: {type(exc).__name__}: {exc}")
          else:
              print(json.dumps({
                  "status": "all_live_spot_sources_unavailable",
                  "errors": errors,
                  "note": "Production may continue through validated candidate cache/history-liquidity layers.",
              }, ensure_ascii=False, indent=2))
              raise RuntimeError("all live spot providers failed: " + " | ".join(errors))
          if errors:
              print(json.dumps({"earlier_provider_warnings": errors}, ensure_ascii=False, indent=2))
          PY
      - name: Exchange security-master smoke test
        timeout-minutes: 5
        continue-on-error: true
        run: ashare-system security-master-smoke
      - name: PIT financial statements and factor smoke test
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json

          from ashare_system.data.financials import AkshareSinaFinancialProvider
          from ashare_system.factors import FUNDAMENTAL_FACTOR_COLUMNS, compute_fundamental_factors

          symbol = "600519"
          facts = AkshareSinaFinancialProvider().get_all(symbol)
          factors = compute_fundamental_factors(facts, datetime.now(timezone.utc).isoformat())
          assert not facts.empty
          assert not factors.empty
          row = factors.iloc[0]
          payload = {
              "symbol": symbol,
              "fact_count": len(facts),
              "metric_count": int(facts["metric"].nunique()),
              "report_period_count": int(facts["period_end"].nunique()),
              "fundamental_period_end": row["fundamental_period_end"].date().isoformat(),
              "fundamental_coverage": float(row["fundamental_coverage"]),
              "available_factors": [
                  name for name in FUNDAMENTAL_FACTOR_COLUMNS if row[name] == row[name]
              ],
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          assert row["fundamental_coverage"] >= 0.6
          PY
