name: Daily A-share production

on:
  push:
    branches:
      - main
      - "phase/4b-daily-production"
    paths:
      - "src/ashare_system/production.py"
      - "src/ashare_system/data/spot.py"
      - "src/ashare_system/data/cache.py"
      - "src/ashare_system/factors/**"
      - "src/ashare_system/reporting.py"
      - "src/ashare_system/site.py"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/daily.yml"
  schedule:
    # 17:23 China Standard Time on weekdays. Holiday runs safely use the latest market date.
    - cron: "23 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore security-master cache
        uses: actions/cache@v4
        with:
          path: data/cache/security_master
          key: ashare-security-master-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ashare-security-master-${{ runner.os }}-
      - name: Install
        run: python -m pip install -e .
      - name: Prepare bounded SSE/SZSE candidate universe
        run: >-
          ashare-daily
          --prepare-only
          --candidate-limit 30
          --allowed-exchanges SSE,SZSE
          --output-root reports/universe
          --cache-root data/cache
      - name: Verify candidate universe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          frame = pd.read_csv("reports/universe/candidates.csv", dtype={"symbol": str})
          manifest = json.loads(Path("reports/universe/universe_manifest.json").read_text(encoding="utf-8"))
          assert len(frame) >= 10
          assert set(frame["exchange"]) <= {"SSE", "SZSE"}
          assert not frame["is_st"].astype(bool).any()
          print(frame[["symbol", "name", "exchange", "screen_source"]].head(10).to_string(index=False))
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Upload candidate handoff
        uses: actions/upload-artifact@v4
        with:
          name: daily-universe-${{ github.run_id }}
          path: reports/universe/
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    needs: universe
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Download candidate handoff
        uses: actions/download-artifact@v4
        with:
          name: daily-universe-${{ github.run_id }}
          path: reports/universe
      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache/bars_raw
          key: ashare-bars-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ashare-bars-raw-${{ runner.os }}-
      - name: Install
        run: python -m pip install -e .
      - name: Fetch candidate history and build research site
        run: >-
          ashare-daily
          --candidates-file reports/universe/candidates.csv
          --top 10
          --history-days 420
          --workers 2
          --adjust ""
          --output-root reports/production
          --site-dir site
          --cache-root data/cache
      - name: Verify production outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("reports/production/manifest.json").read_text(encoding="utf-8"))
          assert manifest["selected_count"] > 0
          assert manifest["history_success_count"] >= manifest["selected_count"]
          assert Path("reports/production/selection/selected.csv").exists()
          assert Path("site/index.html").exists()
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ github.run_id }}
          path: reports/production/
          retention-days: 14
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
