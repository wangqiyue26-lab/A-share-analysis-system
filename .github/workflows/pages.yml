name: Manual A-share dashboard preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Build cloud ranking preview
        run: >-
          ashare-system select-sample
          --symbols 000001,600000,000333,600519,601318,000858,600036,601166,600276,601088
          --top 10
          --output-dir reports/output/pages-latest
      - name: Build static dashboard
        run: >-
          ashare-system build-site
          --selection-dir reports/output/pages-latest
          --output-dir site
          --mode-label "手动研究预览"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
