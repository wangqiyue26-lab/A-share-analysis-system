[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-analysis-system"
version = "0.2.2"
description = "Personal A-share quantitative research and stock-selection system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.17",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
ashare-system = "ashare_system.cli:main"
ashare-daily = "ashare_system.production:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
