name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: CLI health
        run: ashare-system health

  public-data-smoke:
    needs: unit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Multi-endpoint A-share network smoke test
        run: ashare-system smoke-data --symbol 000001 --start 20240102 --end 20240110 --adjust ""
      - name: Trade-calendar smoke test
        continue-on-error: true
        run: ashare-system calendar-smoke --day 2024-01-06
      - name: Exchange security-master smoke test
        continue-on-error: true
        run: ashare-system security-master-smoke

  end-to-end-research-smoke:
    needs: unit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Multi-stock incremental update and factor ranking
        run: >-
          ashare-system pipeline-smoke
          --symbols 000001,600519,000858
          --target 2024-06-28
          --cache-dir data/cache-smoke
          --output-dir reports/pipeline-smoke
          --max-workers 3
          --min-average-amount 0
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-${{ github.run_id }}
          path: reports/pipeline-smoke/
          if-no-files-found: warn
          retention-days: 7
