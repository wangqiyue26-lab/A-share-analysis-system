name: Single historical ST state gap diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/historical-state-gap-probe.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Download official reconstructed lifecycle
        uses: actions/download-artifact@v4
        with:
          name: historical-amount-full-lifecycle-41632436412
          path: reports/state-gap-inputs/lifecycle
          github-token: ${{ github.token }}
          run-id: 41632436412

      - name: Download validated historical daily state archive
        uses: actions/download-artifact@v4
        with:
          name: historical-state-2023-2026-41955532253
          path: reports/state-gap-inputs/state
          github-token: ${{ github.token }}
          run-id: 41955532253

      - name: Identify and re-query the single missing 2025-07-25 state
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          import baostock as bs
          import pandas as pd

          from ashare_system.baostock_state_archive import _read_query_result, _to_bs_code

          target = pd.Timestamp("2025-07-25")
          output = Path("reports/historical-state-gap-probe")
          output.mkdir(parents=True, exist_ok=True)
          lifecycle = pd.read_csv(
              "reports/state-gap-inputs/lifecycle/lifecycle.csv",
              dtype={"symbol": str},
          )
          lifecycle["symbol"] = lifecycle["symbol"].str.zfill(6)
          lifecycle["list_date"] = pd.to_datetime(lifecycle["list_date"])
          lifecycle["delist_date"] = pd.to_datetime(
              lifecycle["delist_date"], errors="coerce"
          )
          members = lifecycle[
              lifecycle["exchange"].isin(["SSE", "SZSE"])
              & lifecycle["list_date"].le(target - pd.Timedelta(days=120))
              & (
                  lifecycle["delist_date"].isna()
                  | lifecycle["delist_date"].gt(target)
              )
          ].copy()
          states = pd.read_parquet(
              "reports/state-gap-inputs/state/historical_states_2023_2026.parquet",
              columns=["symbol", "trade_date", "is_st", "trade_status", "close"],
          )
          states["symbol"] = states["symbol"].astype(str).str.zfill(6)
          states["trade_date"] = pd.to_datetime(states["trade_date"]).dt.normalize()
          missing = sorted(
              set(members["symbol"])
              - set(states.loc[states["trade_date"].eq(target), "symbol"])
          )
          if len(missing) != 1:
              raise RuntimeError(
                  f"Expected exactly one missing state member on 2025-07-25: {missing}"
              )
          symbol = missing[0]
          row = members.loc[members["symbol"].eq(symbol)].iloc[0]
          identity = {
              "symbol": symbol,
              "current_lifecycle_name": str(row["name"]),
              "exchange": str(row["exchange"]),
              "list_date": row["list_date"].date().isoformat(),
              "delist_date": (
                  row["delist_date"].date().isoformat()
                  if pd.notna(row["delist_date"]) else None
              ),
              "date": target.date().isoformat(),
              "strict_point_in_time_evidence": False,
          }
          (output / "gap_identity.json").write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          login = bs.login()
          if login.error_code != "0":
              raise RuntimeError("BaoStock login failed: " + login.error_msg)
          try:
              query = bs.query_history_k_data_plus(
                  _to_bs_code(symbol, str(row["exchange"])),
                  "date,code,close,tradestatus,isST,amount",
                  start_date="2025-07-21",
                  end_date="2025-07-30",
                  frequency="d",
                  adjustflag="3",
              )
              raw = _read_query_result(query)
          finally:
              bs.logout()
          raw.to_csv(output / "provider_window.csv", index=False)
          digest = hashlib.sha256(raw.to_csv(index=False).encode()).hexdigest()
          if raw.empty:
              target_rows = raw
          else:
              raw["trade_date"] = pd.to_datetime(
                  raw["date"], errors="coerce"
              ).dt.normalize()
              if raw["trade_date"].isna().any() or raw["trade_date"].duplicated().any():
                  raise RuntimeError("BaoStock window contains invalid or duplicate dates")
              target_rows = raw[raw["trade_date"].eq(target)].copy()
              neighbor_state = states[
                  states["symbol"].eq(symbol)
                  & states["trade_date"].isin(raw["trade_date"])
              ]
              reference = neighbor_state.merge(
                  raw[["trade_date", "tradestatus", "isST"]],
                  on="trade_date",
                  how="inner",
                  validate="one_to_one",
              )
              if not reference.empty:
                  source_status = reference["tradestatus"].astype(str).eq("1")
                  source_st = reference["isST"].astype(str).eq("1")
                  if (
                      reference["trade_status"].ne(source_status).any()
                      or reference["is_st"].ne(source_st).any()
                  ):
                      raise RuntimeError("New BaoStock neighbor states contradict archive")

          outcome = {
              **identity,
              "source": "BaoStock unadjusted historical daily state re-query",
              "source_window_sha256": digest,
              "retrieved_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_rows_in_window": len(raw),
              "target_row_present": bool(len(target_rows)),
              "status": "research_candidate_available" if len(target_rows) == 1
                        else "unresolved_no_same_day_source_row",
              "real_money_ready": False,
              "ready_for_reconstructed_backtest": False,
          }
          if len(target_rows) == 1:
              value = target_rows.iloc[0]
              if str(value["tradestatus"]) not in {"0", "1"}:
                  raise RuntimeError("Invalid target-day trade status")
              if str(value["isST"]) not in {"0", "1"}:
                  raise RuntimeError("Invalid target-day ST status")
              tradable = str(value["tradestatus"]) == "1"
              close = pd.to_numeric(value["close"], errors="coerce")
              if tradable and (pd.isna(close) or float(close) <= 0):
                  raise RuntimeError("Tradable row lacks positive same-day close")
              patch = pd.DataFrame([{
                  "symbol": symbol,
                  "trade_date": target,
                  "trade_status": tradable,
                  "is_st": str(value["isST"]) == "1",
                  "close": float(close) if pd.notna(close) else float("nan"),
              }])
              patch.to_parquet(output / "candidate_patch.parquet", index=False)
              outcome["source_fields"] = {
                  "trade_status": tradable,
                  "is_st": str(value["isST"]) == "1",
                  "close": patch.iloc[0]["close"],
              }
          (output / "summary.json").write_text(
              json.dumps(outcome, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(outcome, ensure_ascii=False, indent=2))
          PY

      - name: Upload single-day diagnosis without rewriting state ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-state-gap-research-${{ github.run_id }}
          path: reports/historical-state-gap-probe/
          retention-days: 90
          if-no-files-found: warn
